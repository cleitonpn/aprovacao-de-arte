name: Sincronizar dados da produção

# Traz os expositores do app de produção para o espelho deste projeto, de onde
# a tela "Importar da produção" lê.
#
# O que este agendamento AINDA faz, depois que a tela passou a ler ao vivo:
#
# 1. leva o status da arte e a prova para o app de produção — este caminho
#    escreve no outro projeto e não vai para o navegador de ninguém;
# 2. mantém o espelho como RESERVA da tela de importação, para quando o
#    projeto da produção não responder.
#
# Não é mais o caminho principal da importação, e por um motivo medido: o
# agendamento do GitHub é "melhor esforço". Um `*/15` real deu 23 minutos entre
# a primeira e a segunda execução e 2h23 entre a segunda e a terceira — em
# horário de pico a tarefa entra numa fila compartilhada e atrasa ou é pulada.
# Baixar o intervalo não adianta: é a mesma fila.
#
# Antes do primeiro uso, dois secrets em Settings → Secrets and variables →
# Actions:
#
#   FIREBASE_SA_PRODUCAO  service account do projeto montagem-uset (leitura)
#   FIREBASE_SA_ARTE      service account deste projeto (escrita)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Duas execuções ao mesmo tempo escreveriam o mesmo espelho em ordem
# imprevisível. A segunda espera; nenhuma é cancelada no meio de um lote.
concurrency:
  group: sincronizar-producao
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/sincronizar-producao.mjs
        env:
          FIREBASE_SA_PRODUCAO: ${{ secrets.FIREBASE_SA_PRODUCAO }}
          FIREBASE_SA_ARTE: ${{ secrets.FIREBASE_SA_ARTE }}
