name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, e NUNCA cancelar a que está em andamento.
#
# Estava `cancel-in-progress: true`, e isso custou um dia. Publicação do Pages
# cancelada no meio deixa o deployment preso do lado do GitHub, e as seguintes
# ficam em `deployment_queued` até estourar o tempo — dez minutos por
# tentativa, falhando em sequência. Quatro commits empurrados em seguida
# bastaram para travar a fila e deixar no ar uma versão de véspera, enquanto as
# correções pareciam publicadas.
#
# É também o que o workflow oficial do GitHub Pages usa, e pelo mesmo motivo:
# publicação em produção deve terminar. Os pushes intermediários são pulados,
# não cancelados — o último da fila publica e ele já contém os anteriores.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
