name: Publicar as funções de aviso

# Publica as Cloud Functions: os e-mails do cliente (prova pronta, arte
# devolvida, prazo chegando) e o gatilho que leva o status da arte para o app
# de montagem no instante em que ele muda.
#
# Roda sozinho quando algo que as funções usam muda, e à mão pelo botão "Run
# workflow" — porque haverá o dia em que você quer republicar sem ter mudado
# nada (chave nova, região trocada, deploy que falhou pela metade).
#
# Antes do primeiro uso, em Settings → Secrets and variables → Actions:
#
#   FIREBASE_SA_ARTE   service account deste projeto, o MESMO que a sincronização
#                      já usa. Precisa dos papéis de deploy de função (Cloud
#                      Functions Admin, Service Account User, Cloud Build
#                      Editor, Artifact Registry Admin, Cloud Scheduler Admin).
#   RESEND_API_KEY     a chave criada no painel do Resend.
#   FIREBASE_SA_PRODUCAO  service account do projeto do app de montagem — o
#                      MESMO que a sincronização agendada já usa. O gatilho que
#                      publica o status da arte lá precisa dela em tempo de
#                      execução.
#   RESEND_WEBHOOK_SECRET  o segredo do webhook (Resend → Webhooks). Só existe
#                      DEPOIS do primeiro deploy, porque o webhook aponta para
#                      o endereço da função. Enquanto não estiver preenchido,
#                      a função recusa todo retorno — nunca aceita sem conferir.
#
# A chave do Resend NÃO fica no código nem no `firebase.json`: ela é gravada no
# Secret Manager do Google e a função a lê em tempo de execução. Trocar a chave
# depois é rodar este workflow de novo com o secret novo.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/core/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# Dois deploys ao mesmo tempo brigam pelo mesmo recurso no Google. O segundo
# espera; nenhum é cancelado no meio — publicação interrompida deixa a função
# num estado que ninguém consegue explicar depois.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      # A região precisa acompanhar a do banco do Firestore. Se o deploy
      # reclamar de região, troque aqui — não no código.
      REGIAO_FUNCOES: us-central1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Os testes cobrem a regra de quem avisar. Publicar uma função que manda
      # o e-mail errado é pior do que não publicar: e-mail não se desfaz.
      - run: npm ci
      - run: npm test

      # As dependências da FUNÇÃO, que são outras — `functions/` tem o próprio
      # package.json. O `npm ci` acima instala as do site, e sem este passo o
      # CLI falha ao ler os gatilhos: ele carrega o index.js localmente para
      # descobrir o que publicar, e aí não acha o `firebase-functions`.
      - run: npm ci --prefix functions

      # A credencial autentica, mas não diz ao CLI em qual projeto trabalhar —
      # sem `--project` ele para com "No currently active project". O id sai do
      # próprio arquivo da credencial de propósito: escrever o nome do projeto
      # aqui também criaria um segundo lugar para ele ficar errado, e o dia em
      # que os dois discordarem o deploy vai para o projeto errado sem avisar.
      - name: Gravar a credencial
        run: |
          printf '%s' "$FIREBASE_SA_ARTE" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          PROJETO=$(node -p "require('$RUNNER_TEMP/sa.json').project_id")
          if [ -z "$PROJETO" ] || [ "$PROJETO" = "undefined" ]; then
            echo "A credencial FIREBASE_SA_ARTE não tem project_id." >&2
            exit 1
          fi
          echo "FIREBASE_PROJETO=$PROJETO" >> "$GITHUB_ENV"
          echo "Publicando no projeto: $PROJETO"
        env:
          FIREBASE_SA_ARTE: ${{ secrets.FIREBASE_SA_ARTE }}
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Guardar a chave do Resend no Secret Manager
        run: |
          printf '%s' "$RESEND_API_KEY" \
            | npx --yes firebase-tools@13 functions:secrets:set RESEND_API_KEY \
                --project "$FIREBASE_PROJETO" --data-file -
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # O segredo que assina os avisos de entrega do Resend.
      #
      # O valor de reserva existe por uma ordem de operações inevitável: o
      # segredo só é criado no painel do Resend DEPOIS que o endereço da função
      # existe, e o endereço só existe depois de publicar. Sem reserva, o
      # primeiro deploy falharia pedindo um segredo que ainda não tem como
      # existir. Com ela o deploy passa e a função recusa todo retorno até o
      # segredo verdadeiro entrar — que é o lado certo para errar.
      - name: Guardar o segredo do retorno no Secret Manager
        run: |
          printf '%s' "${RESEND_WEBHOOK_SECRET:-ainda-nao-configurado}" \
            | npx --yes firebase-tools@13 functions:secrets:set RESEND_WEBHOOK_SECRET \
                --project "$FIREBASE_PROJETO" --data-file -
        env:
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}

      # A conta de serviço do app de montagem, para o gatilho que publica lá o
      # status da arte no instante em que ele muda.
      #
      # É o MESMO secret que a sincronização agendada já usa — nada novo para
      # criar. Ele passa por aqui porque uma Cloud Function não tem como ler um
      # secret do GitHub: ela só enxerga o Secret Manager do Google, e quem
      # copia um no outro é este passo.
      #
      # Sem valor de reserva, de propósito. Diferente do segredo do Resend, este
      # já existe desde que a sincronização foi montada; se sumir, é melhor o
      # deploy falhar aqui do que publicar um gatilho que vai errar em silêncio
      # a cada arte aprovada.
      - name: Guardar a credencial da produção no Secret Manager
        run: |
          if [ -z "$FIREBASE_SA_PRODUCAO" ]; then
            echo "Falta o secret FIREBASE_SA_PRODUCAO — é o mesmo que a sincronização usa." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SA_PRODUCAO" \
            | npx --yes firebase-tools@13 functions:secrets:set FIREBASE_SA_PRODUCAO \
                --project "$FIREBASE_PROJETO" --data-file -
        env:
          FIREBASE_SA_PRODUCAO: ${{ secrets.FIREBASE_SA_PRODUCAO }}

      - name: Publicar
        run: |
          npx --yes firebase-tools@13 deploy --only functions \
            --project "$FIREBASE_PROJETO" --non-interactive --force

      - name: Apagar a credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
        env:
          RUNNER_TEMP: ${{ runner.temp }}
