name: Publicar a Cloud Function

# Publica a função de envio e as regras do Firestore sem ninguém precisar
# abrir um terminal. Dá para disparar pelo botão "Run workflow" na aba
# Actions, ou automaticamente quando algo da função mudar.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-funcao.yml'

concurrency:
  group: deploy-funcao
  cancel-in-progress: false

env:
  PROJETO: aprovacao-de-arte-49bc3
  REGIAO: southamerica-east1

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir se os segredos estão configurados
        # Os valores chegam por `env`, nunca interpolados direto no script: a
        # chave da conta de serviço é um JSON com aspas e quebras de linha, e
        # interpolá-la no meio de um comando shell quebraria o script.
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TOKEN_EVENTO: ${{ secrets.TOKEN_EVENTO }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: |
          faltando=""
          for nome in GCP_SA_KEY TOKEN_EVENTO OAUTH_CLIENT_ID OAUTH_CLIENT_SECRET OAUTH_REFRESH_TOKEN; do
            if [ -z "${!nome}" ]; then
              faltando="$faltando $nome"
            fi
          done

          if [ -n "$faltando" ]; then
            {
              echo "## Faltam segredos ❌"
              echo ""
              echo "Crie estes segredos em **Settings → Secrets and variables → Actions**:"
              echo ""
              for nome in $faltando; do echo "- \`$nome\`"; done
              echo ""
              echo "👉 https://github.com/${{ github.repository }}/settings/secrets/actions"
              echo ""
              echo "O nome precisa ser exatamente igual, em maiúsculas."
              echo "Os valores estão no SETUP.md, passo 7."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Faltam segredos:$faltando"
            exit 1
          fi

          echo "Todos os cinco segredos estão presentes."

      - name: Escrever as credenciais da função
        # Os segredos nunca aparecem no log: o GitHub mascara os valores, e o
        # arquivo é criado dentro da máquina efêmera do runner.
        env:
          TOKEN_EVENTO: ${{ secrets.TOKEN_EVENTO }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          DRIVE_PASTA_RAIZ: ${{ vars.DRIVE_PASTA_RAIZ }}
          ORIGENS_LIBERADAS: ${{ vars.ORIGENS_LIBERADAS }}
        run: |
          {
            printf 'TOKEN_EVENTO=%s\n' "$TOKEN_EVENTO"
            printf 'OAUTH_CLIENT_ID=%s\n' "$OAUTH_CLIENT_ID"
            printf 'OAUTH_CLIENT_SECRET=%s\n' "$OAUTH_CLIENT_SECRET"
            printf 'OAUTH_REFRESH_TOKEN=%s\n' "$OAUTH_REFRESH_TOKEN"
            [ -n "$DRIVE_PASTA_RAIZ" ] && printf 'DRIVE_PASTA_RAIZ=%s\n' "$DRIVE_PASTA_RAIZ"
            [ -n "$ORIGENS_LIBERADAS" ] && printf 'ORIGENS_LIBERADAS=%s\n' "$ORIGENS_LIBERADAS"
          } > functions/.env
          echo "functions/.env criado com $(wc -l < functions/.env) linhas."

      - name: Escrever a chave da conta de serviço
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/gcp.json','utf8'))" \
            || { echo "::error::O segredo GCP_SA_KEY não é um JSON válido. Cole o conteúdo INTEIRO do arquivo baixado, das chaves { } inclusive."; exit 1; }

      - name: Instalar dependências da função
        run: npm install --prefix functions

      - name: Publicar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project "$PROJETO" \
            --non-interactive \
            --force

      - name: Mostrar o endereço da função
        if: success()
        run: |
          URL="https://$REGIAO-$PROJETO.cloudfunctions.net/envio"
          {
            echo "## Função publicada ✅"
            echo ""
            echo "Endereço da função:"
            echo ""
            echo '```'
            echo "$URL"
            echo '```'
            echo ""
            echo "Este endereço já está configurado no \`.env\` do projeto — não precisa fazer nada com ele."
            echo ""
            echo "Próximo passo: abra a ferramenta, suba uma arte aprovada e clique em **Enviar arte para produção**."
          } >> $GITHUB_STEP_SUMMARY

      - name: Apagar as credenciais
        if: always()
        run: rm -f functions/.env "$RUNNER_TEMP/gcp.json"
